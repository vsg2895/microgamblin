<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 42 42">
  <!-- MicroGamblin mark: the deep-forest tile from Logo.tsx carrying three
       stacks stepping down to the right — the stake getting smaller. The
       tallest is lime; the other two read as its shadow.

       Squared-off corners (rx 9), like everything else on this site.

       The first <rect fill> is read by app/apple-icon.tsx as the background
       plate, so it must stay the first element. src/app/favicon.ico is the
       same artwork rasterised at 16/32/48. -->
  <rect width="42" height="42" rx="9" fill="#0f5a47"/>
  <rect x="8" y="11.5" width="7.6" height="22" rx="2" fill="#c6e83a"/>
  <rect x="17.8" y="18" width="7.6" height="15.5" rx="2" fill="#ffffff" opacity="0.85"/>
  <rect x="27.6" y="24.5" width="7.6" height="9" rx="2" fill="#ffffff" opacity="0.55"/>
</svg>
